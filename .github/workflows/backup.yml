name: Off-server backup and restore drill
# Every 6 hours (GitHub sometimes skips or delays scheduled runs, so the interval is short): pull a consistent snapshot of the live database, PROVE it restores (validation + boot of the real app on it),
# encrypt it, and keep it as an artifact for 30 days. A failure (secrets missing, service down, snapshot bad, drill failed)
# fails the run, and GitHub emails the repository owner about failed runs.
# Needs repository secrets: APP_URL (https://... live address), ADMIN_TOKEN, BACKUP_PASSPHRASE (long random). The artifact is encrypted
# (AES-256, PBKDF2) because artifacts of a public repository can be downloaded by any signed-in GitHub user.
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['ops/backup-ping.txt', '.github/workflows/backup.yml', 'tools/restore-drill.mjs', 'src/restore.js']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check secrets are set
        run: |
          for v in APP_URL ADMIN_TOKEN BACKUP_PASSPHRASE; do [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }; done
          [ ${#BACKUP_PASSPHRASE} -ge 24 ] || { echo "::error::BACKUP_PASSPHRASE must be at least 24 characters"; exit 1; }
      - name: Pull snapshot from the live service
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 180 -H "Authorization: Bearer $ADMIN_TOKEN" "$APP_URL/admin/db-snapshot" -o snapshot.db
          [ "$(head -c 15 snapshot.db)" = "SQLite format 3" ] || { echo "::error::response is not a SQLite file"; exit 1; }
          ls -l snapshot.db
      - name: Restore drill (validate, then boot the real app on the snapshot)
        run: node tools/restore-drill.mjs snapshot.db
      - name: Encrypt, then prove the encrypted copy decrypts to the same bytes
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE -in snapshot.db -out "invoiceguard-$(date -u +%Y%m%d-%H%M).db.enc"
          f=$(ls invoiceguard-*.db.enc)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in "$f" | cmp - snapshot.db
          rm snapshot.db
          echo "ENC_FILE=$f" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: invoiceguard-backup-${{ github.run_id }}
          path: invoiceguard-*.db.enc
          retention-days: 30
          if-no-files-found: error
