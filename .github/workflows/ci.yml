name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install lxml (offline XSD validation of FA(3) and FatturaPA tests)
        run: python3 -m pip install lxml
      - name: Test suite
        shell: bash   # GitHub runs `bash -eo pipefail {0}` only when shell: bash is set; the default is `bash -e {0}`, where a pipe hides the first command's failure
        run: |
          npm test 2>&1 | tee test-output.log
      - name: Prove a failing command inside a pipeline fails the step (this step must itself fail)
        id: pipeproof
        shell: bash
        continue-on-error: true
        run: |
          false | tee /dev/null
          echo "UNREACHABLE: the pipeline failure was hidden"
      - name: Check the pipeline proof
        shell: bash
        run: |
          if [ "${{ steps.pipeproof.outcome }}" != "failure" ]; then echo "A failing pipeline did not fail its step: CI cannot be trusted"; exit 1; fi
          echo "pipeline failure proof: the proof step failed as required"
      - name: Test counts (printed so reviewers can read them in the log and the run summary)
        if: always()
        shell: bash
        run: |
          rc=0
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo)' test-output.log > counts.txt || rc=1
          for f in test/*.test.js; do
            if out=$(node --test --no-warnings "$f" 2>&1); then st=ok; else st=FAILED; rc=1; fi
            echo "$f [$st]: $(echo "$out" | grep -E '^# (tests|pass|fail)' | tr '\n' ' ')" >> counts.txt
          done
          expected=$(tr -d '[:space:]' < .github/expected-test-count)
          actual=$(sed -n 's/^# tests //p' test-output.log | tail -1)
          cancelled=$(sed -n 's/^# cancelled //p' test-output.log | tail -1)
          echo "expected tests: $expected, actual tests: ${actual:-none}, cancelled: ${cancelled:-none}" >> counts.txt
          if [ "$actual" != "$expected" ]; then echo "TEST COUNT MISMATCH: expected $expected, got ${actual:-none}. Tests were lost or added without updating .github/expected-test-count" >> counts.txt; rc=1; fi
          if [ "${cancelled:-x}" != "0" ]; then echo "CANCELLED TESTS: ${cancelled:-none}" >> counts.txt; rc=1; fi
          cat counts.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: 1005-case campaign
        run: node tools/campaign.mjs --no-live
