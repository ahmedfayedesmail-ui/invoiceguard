<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoiceGuard prototype: Decision Card and Pencil Marks (synthetic data)</title>
<style>
:root{--ink:#14202b;--mut:#5d6b78;--line:#e4e9ee;--bg:#f5f7f9;--pri:#0f766e;--red:#c62828;--amb:#b26a00;--paper:#fffdf7;--pencil:#6b7280;--stamp:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.proto{background:#14202b;color:#fff;padding:8px 16px;font-size:13px;letter-spacing:.02em}
header{padding:20px 24px 0;max-width:1100px;margin:auto}h1{font:700 22px Georgia,serif;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:8px;max-width:1100px;margin:0 auto;padding:0 24px}nav button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px 8px 0 0;font:inherit;cursor:pointer;color:var(--mut)}nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--paper);background:var(--paper);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:0 24px 40px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:22px;box-shadow:0 1px 0 #fff inset}
.q{font:600 19px Georgia,serif;margin:0 0 4px}.why{color:var(--mut);margin:0 0 16px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:820px){.trio{grid-template-columns:1fr}}
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;position:relative;box-shadow:2px 2px 0 var(--line)}
.doc h3{margin:0 0 2px;font:600 13px system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}.doc .no{font:600 17px Georgia,serif;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line);font-size:15px}.row:last-child{border:0}.row b{font-weight:600}
.chg{background:linear-gradient(transparent 60%,#ffe08a 60%);padding:0 2px}.neg{color:var(--red)}
.ribbon{position:absolute;top:-10px;right:10px;font-size:11px;padding:2px 8px;border-radius:10px;color:#fff}.ink{background:var(--ink)}.nib{background:var(--pri)}
.sums{margin:14px 0;padding:12px 14px;border-left:4px solid var(--pri);background:#f0faf8;border-radius:0 6px 6px 0}.sums.warn{border-color:var(--amb);background:#fff7e6}
.decide{margin-top:18px;border-top:2px solid var(--ink);padding-top:14px}.decide label{display:block;font-weight:600;margin-bottom:4px}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border:1px solid #c9d2db;border-radius:6px}
.who{display:flex;gap:14px;align-items:center;margin:10px 0;color:var(--mut);font-size:14px}
button.go{background:var(--pri);color:#fff;border:0;padding:12px 18px;border-radius:8px;font:600 16px system-ui;cursor:pointer}button.go:disabled{background:#b8c4cc;cursor:not-allowed}
button.no{background:#fff;border:1px solid #c9d2db;padding:12px 16px;border-radius:8px;font:600 16px system-ui;cursor:pointer;margin-left:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.stamp{display:none;margin-top:16px;border:3px solid var(--stamp);color:var(--stamp);padding:10px 16px;border-radius:6px;transform:rotate(-2deg);font:700 18px Georgia,serif;width:max-content;max-width:100%}.stamp small{display:block;font:13px system-ui;color:var(--ink)}
.list{display:grid;gap:10px;margin-bottom:18px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}.item[aria-current=true]{outline:2px solid var(--pri)}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#fff1d6;color:var(--amb)}
.pencil{font-family:'Segoe Print','Bradley Hand',cursive;color:var(--pencil);border-bottom:2px dashed var(--pencil);padding:0 4px}
.checks{list-style:none;padding:0;margin:10px 0}.checks li{padding:6px 0 6px 28px;position:relative}.checks li:before{content:'';position:absolute;left:0;top:10px;width:16px;height:16px;border-radius:50%;background:var(--pri)}.checks li.bad:before{background:var(--red)}.checks li.bad{color:var(--red)}
.legend{display:flex;gap:18px;font-size:14px;color:var(--mut);margin:0 0 12px}
</style></head><body>
<div class="proto">PROTOTYPE. Synthetic data. Nothing is sent, stored or issued. Not part of the production app.</div>
<header><h1>InvoiceGuard</h1><p class="sub">Two things need a person: a correction to approve, and a reserved amount that never became a document.</p></header>
<nav role="tablist"><button role="tab" aria-selected="true" data-tab="cards">Corrections to approve <span id="n1">(2)</span></button><button role="tab" aria-selected="false" data-tab="pencil">Reserved but not written <span id="n2">(2)</span></button></nav>
<main><section class="sheet" id="cards">
<div class="list" id="cardlist"></div>
<div id="card"></div></section>
<section class="sheet" id="pencil" hidden><div class="list" id="pencillist"></div><div id="pcard"></div></section></main>
<script>
const CARDS=[
{id:'c1',buyer:'Atlas Trading GmbH',orig:{no:'A-2026-000123',total:'121.00',lines:[['Cable HDMI 2.1 2m x2','80.00'],['Shipping','10.00'],['VAT 21%','31.00']],date:'12 Nov 2026'},
 credit:{no:'to be created',total:'-121.00',lines:[['Cancels invoice A-2026-000123','-121.00']]},
 repl:{no:'to be created',total:'121.00',lines:[['Same items','111.00'],['Buyer name','<span class=chg>Atlas Handels GmbH</span>'],['VAT 21%','31.00']]},
 sums:['Already credited on this invoice: 0.00','Left to credit: 121.00','This correction credits: 121.00 (all of it)'],reason:'Buyer asked Amazon to change the billing name.',warn:false},
{id:'c2',buyer:'Nordic Parts AB',orig:{no:'A-2026-000140',total:'60.50',lines:[['Adapter USB-C','50.00'],['VAT 21%','10.50']],date:'15 Nov 2026'},
 credit:{no:'to be created',total:'-60.50',lines:[['Cancels invoice A-2026-000140','-60.50']]},
 repl:{no:'to be created',total:'60.50',lines:[['Buyer VAT number','<span class=chg>changed since the last check</span>']]},
 sums:['The VAT number check (VIES) answered differently from when this card was first shown','Please look at the VAT number again before you decide'],reason:'The buyer VAT number differs from the first import.',warn:true}];
const PENCIL=[
{id:'p1',inv:'A-2026-000123',amt:'121.00',since:'2 days ago',checks:[['No credit note exists for this event',1],['No upload is waiting or in progress',1],['Reserved more than 15 minutes ago',1],['Nothing is running on it right now',1]]},
{id:'p2',inv:'A-2026-000140',amt:'60.50',since:'3 days ago',checks:[['A credit note already exists (R-2026-000007)',0],['Its upload is waiting for Amazon',0]]}];
const $=s=>document.querySelector(s);let cur=null,pcur=null;
function renderList(){ $('#cardlist').innerHTML=CARDS.map(c=>`<div class=item role=button tabindex=0 data-id=${c.id} aria-current=${cur===c.id}><span><b>${c.buyer}</b><br><span class=hint>Invoice ${c.orig.no}</span></span><span class=tag>needs your decision</span></div>`).join('');
 document.querySelectorAll('#cardlist .item').forEach(e=>{e.onclick=()=>{cur=e.dataset.id;renderList();renderCard()};e.onkeydown=k=>{if(k.key==='Enter')e.click()}})}
const rows=l=>l.map(r=>`<div class=row><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
function renderCard(){const c=CARDS.find(x=>x.id===cur);if(!c){$('#card').innerHTML='<p class=why>Pick a correction above.</p>';return}
 $('#card').innerHTML=`<p class=q>Should this correction go ahead?</p><p class=why>${c.reason} Approving lets InvoiceGuard create one credit note and one new invoice. Nothing is sent to Amazon before you decide.</p>
 <div class=legend><span>Ink = a document that exists</span><span>Dotted = a document that would be created</span><span><span class=chg>highlight</span> = what changes</span></div>
 <div class=trio><div class=doc><span class="ribbon ink">in ink</span><h3>Original invoice</h3><p class=no>${c.orig.no}</p>${rows(c.orig.lines)}<div class=row><span>Total</span><b>${c.orig.total}</b></div></div>
 <div class=doc style="border-style:dashed"><span class="ribbon nib">would be created</span><h3>Credit note</h3><p class=no>${c.credit.no}</p>${rows(c.credit.lines)}<div class=row><span>Total</span><b class=neg>${c.credit.total}</b></div></div>
 <div class=doc style="border-style:dashed"><span class="ribbon nib">would be created</span><h3>New invoice</h3><p class=no>${c.repl.no}</p>${rows(c.repl.lines)}<div class=row><span>Total</span><b>${c.repl.total}</b></div></div></div>
 <div class="sums ${c.warn?'warn':''}">${c.sums.map(s=>`<div>${s}</div>`).join('')}</div>
 <div class=decide><label for=why>Why are you deciding this? (at least 10 characters)</label><textarea id=why placeholder="For example: I compared the new name with the buyer's message in Amazon."></textarea>
 <div class=who><span>Deciding as: <b>reviewer-1</b></span><span id=when></span></div>
 <button class=go id=ok disabled>Approve this correction</button><button class=no id=no>Not now</button>
 <p class=hint>Your decision is saved with your name, the time, your reason and a fingerprint of exactly what is on this card. If anything on the card changes later, your decision stops counting and you will see a new card.</p>
 <div class=stamp id=st>Decision signed<small id=sm></small></div></div>`;
 $('#when').textContent='Time is recorded when you sign.';
 const t=$('#why'),b=$('#ok');t.oninput=()=>{b.disabled=t.value.trim().length<10};
 b.onclick=()=>{$('#st').style.display='block';$('#sm').textContent='by reviewer-1, reason saved, fingerprint 9f3a…c1 (prototype only)';b.disabled=true;t.disabled=true};
 $('#no').onclick=()=>{cur=null;renderList();renderCard()}}
function renderPencil(){ $('#pencillist').innerHTML=PENCIL.map(p=>`<div class=item role=button tabindex=0 data-id=${p.id} aria-current=${pcur===p.id}><span><b>Invoice ${p.inv}</b><br><span class=hint>Reserved <span class=pencil>${p.amt}</span> ${p.since}</span></span><span class=tag>${p.checks.every(c=>c[1])?'can be erased by you':'has ink, cannot be erased'}</span></div>`).join('');
 document.querySelectorAll('#pencillist .item').forEach(e=>{e.onclick=()=>{pcur=e.dataset.id;renderPencil();renderP()};e.onkeydown=k=>{if(k.key==='Enter')e.click()}})}
function renderP(){const p=PENCIL.find(x=>x.id===pcur);if(!p){$('#pcard').innerHTML='<p class=why>Pick a reserved amount above.</p>';return}const ok=p.checks.every(c=>c[1]);
 $('#pcard').innerHTML=`<p class=q>This amount was reserved in pencil, but no document was ever written.</p><p class=why>A reservation (pencil) keeps ${p.amt} on invoice ${p.inv} from being credited twice. It was set when a correction was approved. It never wears off by itself. You can erase it only if nothing was written or sent.</p>
 <div class=sums><span class=pencil>${p.amt} reserved in pencil</span></div>
 <ul class=checks>${p.checks.map(c=>`<li class="${c[1]?'':'bad'}">${c[0]}</li>`).join('')}</ul>
 ${ok?`<div class=decide><label for=pw>Why are you erasing it? (at least 10 characters)</label><textarea id=pw placeholder="For example: the app stopped during that run and no credit note was created."></textarea><button class=go id=pok disabled>Erase the pencil mark</button>
 <p class=hint>After erasing, the old approval of this correction no longer counts. A new approval is needed before anything is created.</p><div class=stamp id=pst>Pencil mark erased<small>by reviewer-1, reason saved, history kept (prototype only)</small></div></div>`:`<p class=hint>This reservation belongs to a document that already exists. It cannot be erased here.</p>`}`;
 if(ok){const t=$('#pw'),b=$('#pok');t.oninput=()=>{b.disabled=t.value.trim().length<10};b.onclick=()=>{$('#pst').style.display='block';b.disabled=true;t.disabled=true}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));$('#cards').hidden=b.dataset.tab!=='cards';$('#pencil').hidden=b.dataset.tab!=='pencil'});
renderList();renderCard();renderPencil();renderP();
const h=location.hash.slice(1);if(h.startsWith('c')){cur=h;renderList();renderCard()}if(h.startsWith('p')){pcur=h;document.querySelector('[data-tab=pencil]').click();renderPencil();renderP()}
</script></body></html>
